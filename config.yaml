Global:
  use_gpu: False
  epoch_num: 5
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/rec_multi_language_lite
  save_epoch_step: 3
  # evaluation is run every 5000 iterations after the 4000th iteration
  eval_batch_step: [0, 2000]
  # if pretrained_model is saved in static mode, load_static_weights must set to True
  cal_metric_during_train: True
  pretrained_model:
  checkpoints:
  save_inference_dir:
  use_visualdl: False
  infer_img:
  # for data or label process
  character_dict_path:
  # Set the language of training, if set, select the default dictionary file
  character_type:
  max_text_length: 25
  infer_mode: False
  use_space_char: True

Architecture:
  model_type: rec
  algorithm: CRNN
  # Настройки модели
  backbone:
    type: 'MobileNetV3'
    scale: 0.5
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Optimizer:
  # Оптимизаторы и гиперпараметры
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.001
    regularizer:
      name: 'L2'
      factor: 0.00001

Metric:
  name: RecMetric
  main_indicator: acc

Train:
  # Настройки данных обучения
  dataset:
    name: SimpleDataSet
    type: 'ocr_dataset'
    data_dir: dataset/train/images
    label_file_list: 'dataset/train/train_annotation.csv'
    transforms:
      - DecodeImage: # load image
          img_mode: BGR
          channel_first: False
      - CTCLabelEncode: # Class handling label
      - RecResizeImg:
          image_shape: [ 3, 59, 200 ]
      - KeepKeys:
          keep_keys: [ 'image', 'label', 'length' ]
  loader:
    shuffle: True
    batch_size_per_card: 32
    drop_last: True
    num_workers: 8

Eval:
  # Настройки данных валидации
  dataset:
    name: SimpleDataSet
    type: 'ocr_dataset'
    data_dir: dataset/val/images
    label_file_list: 'dataset/val/val_annotation.csv'
    transforms:
      - DecodeImage: # load image
          img_mode: BGR
          channel_first: False
      - RecAug:
      - CTCLabelEncode: # Class handling label

      - KeepKeys:
          keep_keys: [ 'image', 'label', 'length' ]
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: 32
    num_workers: 8